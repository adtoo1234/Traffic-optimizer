  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root">
      <!-- Initial Loading Shell to prevent blank white flicker before React hydrates -->
      <div id="initial-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; padding: 20px; box-sizing: border-box; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #0284c7, #10b981); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.4);">
          <svg style="width: 30px; height: 30px; fill: none; stroke: white; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
        </div>
        <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em; color: #ffffff;">Global GPS &amp; Distance Navigator</h1>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; max-width: 380px; line-height: 1.5;">Initializing interactive GPS engines, distance metrics, and satellite mapping...</p>
        <div style="width: 32px; height: 32px; border: 3px solid #1e293b; border-top: 3px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
      </div>
    </div>

    <!-- Diagnostic Safeguard for GitHub Pages / Static Hosting Deployments -->
    <script>
      (function() {
        var hasReportedError = false;
        function showDiagnostic(title, desc, technicalDetails) {
          if (hasReportedError || window.__REACT_APP_MOUNTED__) return;
          hasReportedError = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '' +
            '<div style="min-height: 100vh; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;">' +
              '<div style="max-width: 580px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; padding: 32px; box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8); text-align: left;">' +
                '<div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 9999px; margin-bottom: 16px;">' +
                  '<span>GitHub Deployment Assistant</span>' +
                '</div>' +
                '<h2 style="font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #ffffff; letter-spacing: -0.02em;">' + title + '</h2>' +
                '<p style="font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px 0;">' + desc + '</p>' +
                '<div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 20px; font-size: 13px; color: #e2e8f0; line-height: 1.6;">' +
                  '<strong style="color: #38bdf8; font-size: 14px;">How to resolve this in 30 seconds:</strong><br>' +
                  '<div style="margin-top: 8px;">' +
                    '1. Open your GitHub Repository in your browser.<br>' +
                    '2. Click <strong>Settings</strong> &gt; <strong>Pages</strong> in the left sidebar.<br>' +
                    '3. Under <strong>Build and deployment &gt; Source</strong>, switch the dropdown from <em>Deploy from a branch</em> to <strong>GitHub Actions</strong>.<br>' +
                    '4. That\'s it! The included <code>.github/workflows/deploy.yml</code> will automatically build the React app and deploy it live.' +
                  '</div>' +
                '</div>' +
                (technicalDetails ? '<div style="background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-family: monospace; font-size: 11px; color: #f43f5e; max-height: 120px; overflow-y: auto; word-break: break-all;">' + technicalDetails + '</div>' : '') +
                '<div style="display: flex; gap: 10px; flex-wrap: wrap;">' +
                  '<button onclick="window.location.reload()" style="cursor: pointer; background: #2563eb; color: #ffffff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px;">Retry / Reload</button>' +
                  '<a href="./docs/" style="text-decoration: none; display: inline-flex; align-items: center; background: #334155; color: #f8fafc; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13px;">View Pre-built /docs</a>' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        // Check if uncompiled source was served instead of built dist
        window.addEventListener('error', function(e) {
          if (!window.__REACT_APP_MOUNTED__) {
            var msg = e && (e.message || (e.error && e.error.message)) || 'Script failed to load';
            var isTsxError = msg.includes('.tsx') || msg.includes('MIME type') || msg.includes('Unexpected token');
            showDiagnostic(
              isTsxError ? 'Configuration Required: Switch to GitHub Actions' : 'Application Initialization Error',
              isTsxError 
                ? 'Your GitHub Pages is currently serving the raw uncompiled TypeScript source files from the branch root. Browsers cannot execute raw .tsx files directly.'
                : 'An unexpected script load or runtime issue occurred during page initialization.',
              'Details: ' + msg
            );
          }
        });

        // Fallback timeout: If after 3 seconds in production, React hasn't mounted, help the user
        setTimeout(function() {
          if (!window.__REACT_APP_MOUNTED__) {
            var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1;
            if (isGitHubPages) {
              showDiagnostic(
                'GitHub Pages: Enable GitHub Actions',
                'Your repository is configured with "Deploy from a branch (root)", which serves uncompiled files instead of the production build.',
                'Host: ' + window.location.host + ' | Path: ' + window.location.pathname
              );
            }
          }
        }, 3200);
      })();
    </script>

  </body>
